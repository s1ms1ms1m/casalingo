name: Update apartment listings

on:
  schedule:
    # Every day at 11:55 Rome time (UTC+1 winter / UTC+2 summer).
    # Using 10:55 UTC to cover winter; the site redeploys within ~2 min after the push.
    - cron: '55 10 * * *'
  workflow_dispatch:   # allow manual runs from the GitHub Actions tab

permissions:
  contents: write      # needed to push the updated index.html
  actions: write       # needed to start the Pages deploy workflow (gh workflow run)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic json5

      - name: Run tests (fail fast, before any API cost)
        # Uses a frozen fixture, so editing real listings can never break this.
        run: |
          python scripts/test_scoring.py
          python scripts/test_search.py
          python scripts/test_availability.py
          python scripts/test_netlify_ignore.py
          python scripts/test_deploy_pages.py

      - name: Search for new listings
        id: search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_listings.py

      - name: Commit and push (new listings, Top promotions and/or last-checked date)
        id: commit
        # Step outputs contain text derived from web pages / the model, so they are
        # passed as environment variables, never pasted into the script itself.
        env:
          NEW_COUNT: ${{ steps.search.outputs.new_count }}
          SUMMARY: ${{ steps.search.outputs.summary }}
          PROMOTED_COUNT: ${{ steps.search.outputs.promoted_count }}
          PROMOTED_SUMMARY: ${{ steps.search.outputs.promoted_summary }}
          SEARCH_REPORT: ${{ steps.search.outputs.search_report }}
          REJECTED_LINKS: ${{ steps.search.outputs.rejected_links }}
          UNREADABLE: ${{ steps.search.outputs.unreadable }}
        run: |
          git config user.name  "Casalingo Bot"
          git config user.email "casalingo-bot@auto.update"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date +%Y-%m-%d)
          if [ "$NEW_COUNT" = "0" ]; then
            SUBJECT="Last checked $TODAY — no new listings"
          else
            SUBJECT="Add $NEW_COUNT new listing(s) — $TODAY"
          fi
          if [ "${PROMOTED_COUNT:-0}" != "0" ]; then
            SUBJECT="$SUBJECT; $PROMOTED_COUNT promoted to Top"
          fi
          {
            echo "$SUBJECT"
            if [ "$NEW_COUNT" != "0" ]; then echo; echo "$SUMMARY"; fi
            if [ "${PROMOTED_COUNT:-0}" != "0" ]; then echo; echo "Promoted to Top: $PROMOTED_SUMMARY"; fi
            if [ -n "$SEARCH_REPORT" ]; then echo; echo "Search: $SEARCH_REPORT"; fi
            if [ -n "$REJECTED_LINKS" ]; then echo; echo "Rejected links (not a single-ad URL): $REJECTED_LINKS"; fi
            if [ -n "$UNREADABLE" ]; then echo; echo "Could not be read by the bot, check by hand: $UNREADABLE"; fi
            echo
            echo "Co-Authored-By: Claude <noreply@anthropic.com>"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        # A push made with GITHUB_TOKEN does not trigger the push-based workflow, so start it explicitly,
        # then wait for it. If it cannot be started or does not finish with "success", this step FAILS
        # (red run, ::error:: annotation): the listings are saved, but the live site would be out of date.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy_pages.sh "${{ github.event.repository.default_branch }}"

      - name: Summary
        # Still written when only the deploy failed; skipped if the search itself failed (it has no numbers then).
        if: ${{ !cancelled() && steps.search.outcome == 'success' }}
        env:
          NEW_COUNT: ${{ steps.search.outputs.new_count }}
          SUMMARY: ${{ steps.search.outputs.summary }}
          PROMOTED_COUNT: ${{ steps.search.outputs.promoted_count }}
          PROMOTED_SUMMARY: ${{ steps.search.outputs.promoted_summary }}
        run: |
          if [ "$NEW_COUNT" = "0" ]; then
            echo "### ✅ No new listings today" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🏠 $NEW_COUNT new listing(s) added" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${PROMOTED_COUNT:-0}" != "0" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ★ $PROMOTED_COUNT promoted to Top" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$PROMOTED_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🌐 [GitHub Pages](https://s1ms1ms1m.github.io/casalingo/) · [Netlify](https://casalingo.netlify.app)" >> "$GITHUB_STEP_SUMMARY"

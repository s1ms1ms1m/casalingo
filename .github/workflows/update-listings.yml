name: Update apartment listings

on:
  schedule:
    # Every day at 11:55 Rome time (UTC+1 winter / UTC+2 summer).
    # Using 10:55 UTC to cover winter; Netlify deploys within ~2 min after push.
    - cron: '55 10 * * *'
  workflow_dispatch:   # allow manual runs from the GitHub Actions tab

permissions:
  contents: write      # needed to push the updated index.html

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Search for new listings
        id: search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_listings.py

      - name: Commit and push if there are new listings
        if: steps.search.outputs.new_count != '0'
        run: |
          git config user.name  "Casalingo Bot"
          git config user.email "casalingo-bot@auto.update"
          git add index.html
          git commit -m "Add ${{ steps.search.outputs.new_count }} new listing(s) — $(date +%Y-%m-%d)

          ${{ steps.search.outputs.summary }}

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.search.outputs.new_count }}" = "0" ]; then
            echo "### ✅ No new listings today" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🏠 ${{ steps.search.outputs.new_count }} new listing(s) added" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.search.outputs.summary }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🌐 [casalingo.netlify.app](https://casalingo.netlify.app)" >> $GITHUB_STEP_SUMMARY
          fi

name: Update apartment listings

on:
  schedule:
    # Every day at 11:55 Rome time (UTC+1 winter / UTC+2 summer).
    # Using 10:55 UTC to cover winter; the site redeploys within ~2 min after the push.
    - cron: '55 10 * * *'
  workflow_dispatch:   # allow manual runs from the GitHub Actions tab

permissions:
  contents: write      # needed to push the updated index.html
  actions: write       # needed to start the Pages deploy workflow (gh workflow run)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic json5

      - name: One-off search diagnosis (experiment branch only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/availability.py \
            https://www.immobiliare.it/annunci/131084574/ \
            https://www.idealista.it/immobile/35498392/ \
            https://www.immobiliare.it/annunci/117896417/ \
            https://www.immobiliare.it/annunci/112284707/ \
            | tee scripts/diagnostics/candidates.txt

      - name: Commit result to this branch
        run: |
          git config user.name  "Casalingo Bot"
          git config user.email "casalingo-bot@auto.update"
          git add scripts/diagnostics/candidates.txt
          git commit -m "Candidate availability result"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

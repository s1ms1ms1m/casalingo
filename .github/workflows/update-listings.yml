name: Update apartment listings

on:
  schedule:
    # Every day at 11:55 Rome time (UTC+1 winter / UTC+2 summer).
    # Using 10:55 UTC to cover winter; the site redeploys within ~2 min after the push.
    - cron: '55 10 * * *'
  workflow_dispatch:   # allow manual runs from the GitHub Actions tab

permissions:
  contents: write      # needed to push the updated index.html
  actions: write       # needed to start the Pages deploy workflow (gh workflow run)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic json5

      - name: One-off search diagnosis (experiment branch only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/debug_fetch.py \
            https://www.immobiliare.it/annunci/130839936/ \
            https://www.immobiliare.it/annunci/128367780/ \
            https://www.immobiliare.it/annunci/128608380/ \
            https://www.immobiliare.it/en/annunci/127335231/ \
            https://www.immobiliare.it/annunci/129969450/ \
            https://www.immobiliare.it/annunci/130803894/ \
            https://www.immobiliare.it/annunci/131464854/ \
            https://www.immobiliare.it/annunci/132359476/ \
            https://www.immobiliare.it/annunci/133383032/ \
            https://www.idealista.it/immobile/34352825/ \
            https://www.idealista.it/immobile/34683058/ \
            https://www.idealista.it/immobile/35904288/

      - name: Commit result to this branch
        run: |
          git config user.name  "Casalingo Bot"
          git config user.email "casalingo-bot@auto.update"
          git add scripts/diagnostics
          git commit -m "Fetch debug result"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
